global:
  scrape_interval: 1m

scrape_configs:
  - job_name: 'prometheus'
    scrape_interval: 30s
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']

rule_files:
  - /etc/prometheus/alert.rules.yml  # Reference the alert rules file

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']  # Point to Alertmanager